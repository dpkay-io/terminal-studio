# The one Rust version every build uses: local, CI and release.
#
# Pinned rather than "stable" so a new Rust release can't break CI or a
# release build on its own. (Rust 1.100.0 failed to compile objc2 0.4.1, which
# eframe 0.28 pulled in on macOS; eframe 0.37 no longer does.) Move this
# forward in its own PR, once the build and clippy pass on the new version.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
