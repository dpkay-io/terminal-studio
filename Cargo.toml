[package]
name = "terminal-studio"
version = "0.20.0"
edition = "2021"
description = "GPU-accelerated terminal multiplexer with workspaces, file browser, git integration, and markdown preview"
license = "Apache-2.0"
repository = "https://github.com/dpkay-io/terminal-studio"
keywords = ["terminal", "multiplexer", "egui", "tui", "wgpu"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.95"

[dependencies]
# UI framework (wgpu primary, glow fallback for machines with limited GPU drivers)
# default-features=false drops accesskit (crashes on corporate Windows with accessibility tools)
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts", "clipboard", "links", "persistence", "wayland", "x11"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# monochrome_emoji_fonts: the emoji fonts egui bundled by default before 0.37
# (NotoEmoji, emoji-icon-font), which file icons like 📝 come from.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Maps system fallback fonts (Arial Unicode, CJK fonts: tens of MB) instead of
# reading them into memory. Already in the tree via the font stack.
memmap2 = "0.9"

# VT/ANSI byte-stream parser (same as Alacritty)
vte = "0.13"

# Alacritty terminal emulator library — replaces hand-rolled VT emulator
alacritty_terminal = "0.26"

# Cross-platform PTY: ConPTY on Windows, openpty on Unix
portable-pty = "0.9"

# Error handling
anyhow = "1"

# Concurrency
parking_lot = "0.12"

# Logging
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# File-system watching (cross-platform: ReadDirectoryChangesW / inotify / FSEvents)
notify = "6"

# Native file/folder picker dialogs
rfd = "0.15"

# Fuzzy matching for search bars (Sublime Text-style scoring)
fuzzy-matcher = "0.3"

# Lightweight system resource monitoring (CPU, RAM, network)
sysinfo = "0.33"

# Self-update: HTTP client (rustls = no OpenSSL), version comparison
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
semver = "1"

# URL detection in terminal output
regex = "1"

# Self-update: replace running binary (works on Windows where exe is locked)
self-replace = "1"

# Cross-platform "open URL in browser"
open = "5"

# Clipboard access (OSC 52 support)
arboard = "3"

# Base64 decoding (OSC 52 payloads)
base64 = "0.22"

# Syntax highlighting (Sublime Text grammars, pure-Rust regex backend)
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "plist-load"] }
zstd = "0.13"
pulldown-cmark = { version = "0.12", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS updater: atomic bundle swap (renamex_np), process liveness, and
# `hdiutil info -plist` parsing. Both are already in the tree via eframe/syntect.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1"

# Pointer position while files are dragged in from another app (`os_cursor`).
# libX11 is loaded at runtime, as winit does; already in the tree via winit.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[dev-dependencies]
tempfile = "3"
# Builds the event-loop errors eframe reports, for the renderer-fallback
# tests. Same version eframe uses; no features, so test builds enable none
# eframe does not already.
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

# winit 0.30.13 on Windows: dragging the window across monitors with different
# scaling flips it between the two scales and grows it every crossing (flicker
# and a drag that fights the cursor; upstream reports a crash once it passes
# the GPU's texture limit): rust-windowing/winit#4041. The fix is one commit on
# top of v0.30.13, the open 0.30 backport rust-windowing/winit#4694, which
# applies the rect Windows suggests during a live drag. Pinned by full SHA;
# deny.toml allows only this git source. Remove both once winit 0.30.14 (or an
# eframe on winit 0.31) ships the fix.
[patch.crates-io]
winit = { git = "https://github.com/rust-windowing/winit", rev = "39c4009c41e5977d779cf8a365792c8153ca77c5" }
