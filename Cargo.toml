[package]
name = "terminal-studio"
version = "0.17.0"
edition = "2021"
description = "GPU-accelerated terminal multiplexer with workspaces, file browser, git integration, and markdown preview"
license = "Apache-2.0"
repository = "https://github.com/dpkay-io/terminal-studio"
keywords = ["terminal", "multiplexer", "egui", "tui", "wgpu"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.75"

[dependencies]
# UI framework (wgpu primary, glow fallback for machines with limited GPU drivers)
# default-features=false drops accesskit (crashes on corporate Windows with accessibility tools)
eframe = { version = "0.28", default-features = false, features = ["wgpu", "glow", "default_fonts", "persistence", "wayland", "x11"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.28"
# Maps system fallback fonts (Arial Unicode, CJK fonts: tens of MB) instead of
# reading them into memory. Already in the tree via the font stack.
memmap2 = "0.9"

# VT/ANSI byte-stream parser (same as Alacritty)
vte = "0.13"

# Alacritty terminal emulator library — replaces hand-rolled VT emulator
alacritty_terminal = "0.26"

# Cross-platform PTY: ConPTY on Windows, openpty on Unix
portable-pty = "0.8"

# Error handling
anyhow = "1"

# Concurrency
parking_lot = "0.12"

# Logging
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# File-system watching (cross-platform: ReadDirectoryChangesW / inotify / FSEvents)
notify = "6"

# Native file/folder picker dialogs
rfd = "0.15"

# Fuzzy matching for search bars (Sublime Text-style scoring)
fuzzy-matcher = "0.3"

# Lightweight system resource monitoring (CPU, RAM, network)
sysinfo = "0.33"

# Self-update: HTTP client (rustls = no OpenSSL), version comparison
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
semver = "1"

# URL detection in terminal output
regex = "1"

# Self-update: replace running binary (works on Windows where exe is locked)
self-replace = "1"

# Cross-platform "open URL in browser"
open = "5"

# Clipboard access (OSC 52 support)
arboard = "3"

# Base64 decoding (OSC 52 payloads)
base64 = "0.22"

# Syntax highlighting (Sublime Text grammars, pure-Rust regex backend)
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "plist-load"] }
zstd = "0.13"
pulldown-cmark = { version = "0.12", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS updater: atomic bundle swap (renamex_np), process liveness, and
# `hdiutil info -plist` parsing. Both are already in the tree via eframe/syntect.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1"

[dev-dependencies]
tempfile = "3"
# Builds the event-loop errors eframe reports, for the renderer-fallback
# tests. Same version eframe uses; no features, so test builds enable none
# eframe does not already.
winit = { version = "0.29", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

# Debug builds crashed at launch on macOS 27: winit 0.29 iterates
# `NSScreen.screens`, now a Swift array whose fast enumeration returns `Q`
# (NSUInteger) where objc2 0.4's debug-only signature check expects `q`. Both
# are the same 64-bit return, so the check is a false alarm (objc2#566; fixed
# upstream from objc2 0.5.2 as `relax-sign-encoding`, which 0.4 lacks). Release
# builds never run the check. Remove this once eframe/winit no longer pull in
# objc2 0.4 — cargo then warns that the spec matches nothing.
[profile.dev.package."objc2@0.4.1"]
debug-assertions = false
